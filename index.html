<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡單相簿 Simple Album</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23B8AFA0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5F0; --stone:#EDE8DE; --taupe:#B8AFA0; --ink:#3E3A34; --ink-soft:#8A8378;
  --sage:#9CAA8C; --line:#E3DED2; --maxw:1200px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
h1,h2,h3{font-family:'Noto Serif TC',serif;font-weight:600;margin:0;}
button,input,select{font-family:inherit;}
.hidden{display:none !important;}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sage);outline-offset:2px;}

.site-header{position:sticky;top:0;z-index:100;background:rgba(247,245,240,0.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);}
.header-inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;flex-wrap:wrap;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;}
.logo-wrap{width:36px;height:36px;flex:0 0 36px;}
.logo-wrap img{width:36px;height:36px;border-radius:50%;object-fit:cover;display:block;}
.logo-fallback{width:36px;height:36px;border-radius:50%;background:var(--taupe);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif TC',serif;font-size:15px;}
.site-title{font-family:'Noto Serif TC',serif;font-size:19px;font-weight:600;letter-spacing:.02em;}
.main-nav{display:flex;align-items:center;gap:22px;font-size:14.5px;}
.main-nav a{padding:4px 2px;border-bottom:1px solid transparent;}
.main-nav a:hover{border-bottom-color:var(--sage);}

main#app{max-width:var(--maxw);margin:0 auto;padding:32px 24px 90px;min-height:60vh;}
.section{margin-bottom:56px;}
.section-title{font-size:20px;margin-bottom:18px;letter-spacing:.02em;}
.empty-note{color:var(--ink-soft);font-size:14px;padding:12px 0;}
.strip{display:flex;gap:18px;overflow-x:auto;padding-bottom:10px;}
.strip-item{flex:0 0 168px;}

.albums-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:24px;}
.album-cover{aspect-ratio:4/3;background:var(--stone);overflow:hidden;}
.album-cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease;}
.album-card:hover .album-cover img{transform:scale(1.03);}
.ph-cover{width:100%;height:100%;}
.album-meta{padding:10px 2px;}
.album-name{font-size:15px;font-weight:600;}
.album-count{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px;}
.product-image{aspect-ratio:1/1;background:var(--stone);overflow:hidden;cursor:zoom-in;}
.product-image img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease;}
.product-card:hover .product-image img{transform:scale(1.04);}
.ph-image{width:100%;height:100%;}
.product-meta{padding:8px 3px 0;}
.product-name{font-size:13.5px;font-weight:500;}
.product-code{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

.breadcrumb{margin-bottom:18px;font-size:14px;color:var(--ink-soft);}
.album-header{margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--line);}
.album-title{font-size:24px;}
.album-sub{font-size:13px;color:var(--ink-soft);margin-top:4px;}

.btn{font-size:13.5px;padding:9px 18px;border:1px solid var(--taupe);background:#fff;color:var(--ink);cursor:pointer;border-radius:2px;transition:background .2s ease;}
.btn:hover{background:var(--stone);}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn.primary:hover{background:#524c42;}
.btn.ghost{background:transparent;}
.btn.small{padding:6px 14px;font-size:12.5px;}
.btn.danger{color:#a4514f;border-color:#d8b9b6;}
.btn.danger:hover{background:#f7ecec;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.lightbox{position:fixed;inset:0;background:rgba(30,28,24,.92);z-index:600;display:flex;align-items:center;justify-content:center;}
.lb-close{position:absolute;top:18px;right:22px;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:22px;width:40px;height:40px;border-radius:50%;cursor:pointer;z-index:2;}
.lb-close:hover{background:rgba(255,255,255,.22);}
.lb-content{display:flex;flex-direction:column;align-items:center;max-width:90vw;max-height:92vh;}
.lb-image-wrap{max-width:82vw;max-height:72vh;display:flex;align-items:center;justify-content:center;}
.lb-image-wrap img{max-width:82vw;max-height:72vh;object-fit:contain;display:block;}
.ph-image-lg{width:320px;height:320px;max-width:65vw;max-height:55vh;}
.lb-meta{color:#fff;text-align:center;margin-top:16px;}
.lb-name{font-size:16px;font-weight:600;}
.lb-code{font-size:13px;color:#cfc9bd;margin-top:4px;}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:none;border:none;color:#fff;font-size:36px;cursor:pointer;padding:10px 16px;opacity:.8;}
.lb-nav:hover{opacity:1;}
.lb-prev{left:4px;}
.lb-next{right:4px;}

.admin-login{max-width:340px;margin:70px auto;text-align:center;}
.admin-login input{width:100%;padding:11px;margin:16px 0;border:1px solid var(--taupe);border-radius:2px;font-size:14px;}
.admin-login .hint{font-size:12px;color:var(--ink-soft);margin-top:10px;}
.admin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.notice-box{background:#fff;border:1px solid var(--line);border-left:3px solid var(--sage);padding:14px 18px;font-size:13px;color:var(--ink-soft);margin-bottom:24px;line-height:1.8;}
.notice-box strong{color:var(--ink);}
.admin-tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:26px;}
.tab-btn{background:none;border:none;padding:10px 16px;font-size:14px;cursor:pointer;color:var(--ink-soft);border-bottom:2px solid transparent;}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--sage);font-weight:600;}
.admin-section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.admin-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);}
.admin-row{display:flex;align-items:center;gap:14px;padding:12px 8px;border-bottom:1px solid var(--line);background:#fff;}
.admin-row:hover{background:#fbfaf7;}
.row-thumb{width:48px;height:48px;flex:0 0 48px;background:var(--stone);overflow:hidden;}
.row-thumb img{width:100%;height:100%;object-fit:cover;}
.thumb-ph{width:100%;height:100%;}
.row-info{flex:1;min-width:0;}
.row-name{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.row-actions{display:flex;gap:8px;flex:0 0 auto;}
.album-select-label{display:block;margin-bottom:16px;font-size:13.5px;color:var(--ink-soft);}
.album-select-label select{margin-left:8px;padding:7px 10px;border:1px solid var(--taupe);border-radius:2px;font-size:13.5px;}
.settings-form{max-width:420px;display:flex;flex-direction:column;}
.settings-form label{font-size:13px;color:var(--ink-soft);margin-top:14px;margin-bottom:5px;}
.settings-form input[type=text]{padding:10px;border:1px solid var(--taupe);border-radius:2px;font-size:14px;}
.settings-form button{margin-top:22px;align-self:flex-start;}

.modal-backdrop{position:fixed;inset:0;background:rgba(30,28,24,.5);z-index:700;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:#fff;padding:28px;max-width:420px;width:100%;border-radius:2px;max-height:90vh;overflow-y:auto;}
.modal-box h3{margin-bottom:6px;font-size:17px;}
.modal-box label{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:14px;margin-bottom:5px;}
.modal-box input[type=text],.modal-box input[type=password]{width:100%;padding:9px;border:1px solid var(--taupe);border-radius:2px;font-size:14px;}
.modal-box input[type=file]{font-size:13px;width:100%;}
.modal-box select{width:100%;padding:9px;border:1px solid var(--taupe);border-radius:2px;font-size:14px;background:#fff;}
.file-preview{margin-top:10px;}
.file-preview img{max-width:120px;max-height:120px;border:1px solid var(--line);object-fit:cover;display:block;}
.file-hint2{font-size:12px;color:var(--ink-soft);}
.upload-status{font-size:11.5px;margin-top:4px;color:var(--ink-soft);}
.upload-status.ok{color:var(--sage);}
.upload-status.err{color:#a4514f;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:3px;font-size:13.5px;opacity:0;transition:opacity .25s ease,transform .25s ease;z-index:800;max-width:80vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.site-footer{text-align:center;padding:34px 20px;font-size:12px;color:var(--ink-soft);}
.loading-note{text-align:center;padding:70px 0;color:var(--ink-soft);font-size:14px;}

@media (max-width:600px){
  .header-inner{padding:12px 16px;}
  .site-title{font-size:16px;}
  main#app{padding:22px 16px 70px;}
  .lb-nav{font-size:26px;padding:6px 8px;}
  .albums-grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:16px;}
  .products-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="#/" class="brand">
      <span class="logo-wrap">
        <img id="logoImg" src="" alt="Logo" class="hidden">
        <span id="logoFallback" class="logo-fallback"></span>
      </span>
      <span class="site-title" id="siteTitleText"></span>
    </a>
    <nav class="main-nav">
      <a href="#/">首頁</a>
      <a href="#/admin">後台管理</a>
    </nav>
  </div>
</header>

<main id="app"><p class="loading-note">載入中…</p></main>

<footer class="site-footer">簡單、乾淨、容易管理的產品相簿 · 適合以連結分享給客戶瀏覽</footer>

<div id="lightbox" class="lightbox hidden">
  <button class="lb-close" onclick="closeLightbox()" aria-label="關閉">✕</button>
  <button class="lb-nav lb-prev" onclick="navigateLightbox(-1)" aria-label="上一張">‹</button>
  <div class="lb-content">
    <div class="lb-image-wrap" id="lbImageWrap"></div>
    <div class="lb-meta">
      <div class="lb-name" id="lbName"></div>
      <div class="lb-code" id="lbCode"></div>
    </div>
  </div>
  <button class="lb-nav lb-next" onclick="navigateLightbox(1)" aria-label="下一張">›</button>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast hidden"></div>

<script>
/* 前台快速登入檢查用的密碼；真正的保護在 netlify/functions 裡的 ADMIN_PW，
   要改密碼的話，這裡跟 save-data.js、upload-image.js 三個地方都要改成一樣 */
var ADMIN_PW='admin123';
var NEW_ARRIVAL_DAYS=7*24*60*60*1000;
var PALETTE=['#D9C9B8','#C9CFC0','#D9C2BE','#C7C2B8','#B9C4B0','#D6C7B0','#C2C7C9','#CBB8AE'];

var DATA=null;
var adminTab='albums';
var currentAdminAlbumId=null;
var lbList=[], lbIndex=-1;
var touchStartX=null;
var toastTimer=null;

/* ---------- 工具 ---------- */
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function guessExt(name){ var m=/\.[a-zA-Z0-9]+$/.exec(name||''); return m?m[0]:'.jpg'; }
function escapeHtml(str){ if(str===null||str===undefined) return ''; return String(str).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function formatDate(ts){ if(!ts) return '—'; var d=new Date(ts); return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'); }
function colorFromString(str){ var h=0; for(var i=0;i<str.length;i++){ h=str.charCodeAt(i)+((h<<5)-h); } return PALETTE[Math.abs(h)%PALETTE.length]; }
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.remove('hidden');
  requestAnimationFrame(function(){ t.classList.add('show'); });
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ t.classList.add('hidden'); },300); },2600);
}
function getAdminPw(){ return sessionStorage.getItem('psa_admin_pw')||''; }
function imgOrPh(key, phCls, seedForColor){
  if(key){ return '<img src="/.netlify/functions/get-image?key='+encodeURIComponent(key)+'" alt="" loading="lazy">'; }
  return '<div class="'+phCls+'" style="background:'+colorFromString(seedForColor)+'"></div>';
}
function resizeImage(file,maxDim,quality,cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var w=img.width,h=img.height;
      if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } } else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
      var canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      var ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',quality));
    };
    img.onerror=function(){ cb(null); };
    img.src=e.target.result;
  };
  reader.onerror=function(){ cb(null); };
  reader.readAsDataURL(file);
}
function uploadImage(file,cb){
  resizeImage(file,1100,0.82,function(dataUrl){
    if(!dataUrl){ cb(null); return; }
    var key=uid()+guessExt(file.name);
    fetch('/.netlify/functions/upload-image',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:getAdminPw(), key:key, dataUrl:dataUrl})
    }).then(function(r){ return r.json(); }).then(function(res){
      if(res && res.ok){ cb(key); } else { cb(null); alert('照片上傳失敗：'+(res&&res.error||'未知錯誤')); }
    }).catch(function(e){ cb(null); alert('照片上傳失敗：'+e.message); });
  });
}
function saveToServer(successMsg){
  return fetch('/.netlify/functions/save-data',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:getAdminPw(), data:DATA})
  }).then(function(r){ return r.json().then(function(j){ return {status:r.status, json:j}; }); })
  .then(function(res){
    if(res.status===200 && res.json.ok){ if(successMsg) toast(successMsg); return true; }
    alert('儲存失敗：'+(res.json.error||'請確認密碼是否正確，或稍後再試一次'));
    return false;
  }).catch(function(e){ alert('儲存失敗（可能是網路問題）：'+e.message); return false; });
}

/* ---------- 啟動：向伺服器讀取目前資料 ---------- */
function defaultSettings(){ return {siteTitle:'簡單相簿 Simple Album', logo:null}; }
function fetchData(){
  return fetch('/.netlify/functions/get-data',{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(d){
    DATA=d;
    if(!DATA.settings) DATA.settings=defaultSettings();
    if(!DATA.albums) DATA.albums=[];
    if(!DATA.products) DATA.products=[];
  });
}
function boot(){
  fetchData().then(function(){ updateHeader(); render(); }).catch(function(e){
    document.getElementById('app').innerHTML='<p class="empty-note">資料載入失敗，請重新整理頁面。（'+escapeHtml(e.message)+'）</p>';
  });
}
window.addEventListener('DOMContentLoaded', function(){ boot(); initLightboxTouch(); });

/* ---------- 路由 ---------- */
function getRouteSegs(){ var h=location.hash||''; h=h.replace(/^#\/?/,''); return h.split('/').filter(Boolean); }
function render(){
  if(!DATA) return;
  var segs=getRouteSegs();
  var app=document.getElementById('app');
  if(segs[0]==='album' && segs[1]){ app.innerHTML=renderAlbumHtml(segs[1]); }
  else if(segs[0]==='admin'){ app.innerHTML=renderAdminHtml(); }
  else { app.innerHTML=renderHomeHtml(); }
  window.scrollTo({top:0});
}
window.addEventListener('hashchange', render);

/* ---------- 頁首 ---------- */
function updateHeader(){
  var logoImg=document.getElementById('logoImg'), fallback=document.getElementById('logoFallback');
  if(DATA.settings.logo){ logoImg.src='/.netlify/functions/get-image?key='+encodeURIComponent(DATA.settings.logo); logoImg.classList.remove('hidden'); fallback.classList.add('hidden'); }
  else { logoImg.classList.add('hidden'); fallback.classList.remove('hidden'); fallback.textContent=(DATA.settings.siteTitle||'品').charAt(0); }
  document.getElementById('siteTitleText').textContent=DATA.settings.siteTitle||'簡單相簿';
  document.title=DATA.settings.siteTitle||'簡單相簿';
}

/* ---------- 卡片渲染 ---------- */
function renderAlbumCard(album){
  var count=DATA.products.filter(function(p){return p.albumId===album.id;}).length;
  return '<a class="album-card" href="#/album/'+album.id+'">'+
    '<div class="album-cover">'+imgOrPh(album.cover,'ph-cover',album.id)+'</div>'+
    '<div class="album-meta"><div class="album-name">'+escapeHtml(album.name)+'</div><div class="album-count">'+count+' 件商品</div></div>'+
    '</a>';
}
function renderProductCard(product, stripMode){
  return '<div class="product-card'+(stripMode?' strip-item':'')+'">'+
    '<div class="product-image" onclick="openLightbox(\''+product.id+'\')">'+imgOrPh(product.image,'ph-image',product.id)+'</div>'+
    '<div class="product-meta"><div class="product-name">'+escapeHtml(product.name)+'</div><div class="product-code">'+escapeHtml(product.code||'')+'</div></div>'+
    '</div>';
}

/* ---------- 首頁 ---------- */
function renderHomeHtml(){
  var newItems=DATA.products.filter(function(p){ return p.createdAt && (Date.now()-p.createdAt)<=NEW_ARRIVAL_DAYS; }).sort(function(a,b){return b.createdAt-a.createdAt;});
  var newHtml='<section class="section"><h2 class="section-title">🆕 最近 7 天新品</h2>';
  newHtml += newItems.length? '<div class="strip">'+newItems.map(function(p){return renderProductCard(p,true);}).join('')+'</div>' : '<p class="empty-note">目前沒有最近上架的新品。</p>';
  newHtml += '</section>';
  var albums=DATA.albums.slice().sort(function(a,b){return a.order-b.order;});
  var albumsHtml='<section class="section"><h2 class="section-title">所有相簿</h2>';
  albumsHtml += albums.length? '<div class="albums-grid">'+albums.map(renderAlbumCard).join('')+'</div>' : '<p class="empty-note">尚未建立任何相簿，請至後台管理新增。</p>';
  albumsHtml += '</section>';
  return newHtml+albumsHtml;
}

/* ---------- 相簿頁 ---------- */
function renderAlbumHtml(albumId){
  var album=DATA.albums.find(function(a){return a.id===albumId;});
  if(!album){ return '<div class="section"><p class="empty-note">找不到此相簿。</p><a href="#/">← 返回首頁</a></div>'; }
  var products=DATA.products.filter(function(p){return p.albumId===albumId;}).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
  var grid=products.length? '<div class="products-grid">'+products.map(function(p){return renderProductCard(p,false);}).join('')+'</div>' : '<p class="empty-note">此相簿尚無商品。</p>';
  return '<div class="breadcrumb"><a href="#/">← 返回首頁</a></div>'+
    '<div class="album-header"><h2 class="album-title">'+escapeHtml(album.name)+'</h2>'+
    '<div class="album-sub">'+products.length+' 件商品 · 建立於 '+formatDate(album.createdAt)+'</div></div>'+grid;
}

/* ---------- 燈箱 ---------- */
function openLightbox(pid){
  var p=DATA.products.find(function(x){return x.id===pid;});
  if(!p) return;
  lbList=DATA.products.filter(function(x){return x.albumId===p.albumId;}).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
  lbIndex=lbList.findIndex(function(x){return x.id===pid;});
  renderLightboxContent();
  document.getElementById('lightbox').classList.remove('hidden');
  document.body.style.overflow='hidden';
}
function closeLightbox(){ document.getElementById('lightbox').classList.add('hidden'); document.body.style.overflow=''; }
function navigateLightbox(delta){ if(!lbList.length) return; lbIndex=(lbIndex+delta+lbList.length)%lbList.length; renderLightboxContent(); }
function renderLightboxContent(){
  var p=lbList[lbIndex]; if(!p) return;
  document.getElementById('lbImageWrap').innerHTML=imgOrPh(p.image,'ph-image-lg',p.id);
  document.getElementById('lbName').textContent=p.name;
  document.getElementById('lbCode').textContent=p.code||'';
}
function initLightboxTouch(){
  var wrap=document.getElementById('lbImageWrap');
  wrap.addEventListener('touchstart', function(e){ touchStartX=e.touches[0].clientX; }, {passive:true});
  wrap.addEventListener('touchend', function(e){
    if(touchStartX===null) return;
    var dx=e.changedTouches[0].clientX-touchStartX;
    if(Math.abs(dx)>50){ if(dx<0) navigateLightbox(1); else navigateLightbox(-1); }
    touchStartX=null;
  }, {passive:true});
}
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closeLightbox(); }
  if(!document.getElementById('lightbox').classList.contains('hidden')){
    if(e.key==='ArrowLeft') navigateLightbox(-1);
    if(e.key==='ArrowRight') navigateLightbox(1);
  }
});

/* ---------- 後台管理 ---------- */
function renderAdminHtml(){
  if(sessionStorage.getItem('psa_admin_ok')!=='1'){
    return '<div class="admin-login"><h2>後台管理登入</h2>'+
      '<input type="password" id="admin_pw" placeholder="請輸入管理密碼" onkeydown="if(event.key===\'Enter\')adminLogin()">'+
      '<button class="btn primary" onclick="adminLogin()">登入</button>'+
      '<p class="hint">（示範密碼：admin123，正式使用前建議請人幫你把密碼改掉）</p></div>';
  }
  var body='';
  if(adminTab==='albums') body=renderAdminAlbums();
  else if(adminTab==='products') body=renderAdminProducts();
  else body=renderAdminSettings();
  return '<div class="admin-wrap">'+
    '<div class="notice-box"><strong>這個版本會即時同步：</strong>後台新增/編輯/刪除，儲存後幾秒內，所有人（包含客戶手機）打開網址就會看到最新內容，不用再匯出或重新上傳檔案。</div>'+
    '<div class="admin-top"><h2>後台管理</h2><button class="btn ghost small" onclick="adminLogout()">登出</button></div>'+
    '<div class="admin-tabs">'+
    '<button class="tab-btn'+(adminTab==='albums'?' active':'')+'" onclick="switchAdminTab(\'albums\')">相簿管理</button>'+
    '<button class="tab-btn'+(adminTab==='products'?' active':'')+'" onclick="switchAdminTab(\'products\')">商品管理</button>'+
    '<button class="tab-btn'+(adminTab==='settings'?' active':'')+'" onclick="switchAdminTab(\'settings\')">網站設定</button>'+
    '</div><div class="admin-body">'+body+'</div></div>';
}
function adminLogin(){
  var pw=document.getElementById('admin_pw').value;
  if(pw===ADMIN_PW){ sessionStorage.setItem('psa_admin_pw', pw); sessionStorage.setItem('psa_admin_ok','1'); render(); }
  else { alert('密碼錯誤，請再試一次。'); }
}
function adminLogout(){ sessionStorage.removeItem('psa_admin_ok'); sessionStorage.removeItem('psa_admin_pw'); location.hash='#/'; }
function switchAdminTab(tab){ adminTab=tab; render(); }

function renderAdminAlbums(){
  var albums=DATA.albums.slice().sort(function(a,b){return a.order-b.order;});
  var rows=albums.map(function(a){
    var count=DATA.products.filter(function(p){return p.albumId===a.id;}).length;
    return '<li class="admin-row"><div class="row-thumb">'+imgOrPh(a.cover,'thumb-ph',a.id)+'</div>'+
      '<div class="row-info"><div class="row-name">'+escapeHtml(a.name)+'</div><div class="row-sub">'+count+' 件商品 · '+formatDate(a.createdAt)+'</div></div>'+
      '<div class="row-actions"><button class="btn small" onclick="openAlbumForm(\''+a.id+'\')">編輯</button><button class="btn small danger" onclick="deleteAlbum(\''+a.id+'\')">刪除</button></div></li>';
  }).join('');
  return '<div class="admin-section-head"><h3>相簿管理</h3><button class="btn primary" onclick="openAlbumForm(null)">+ 新增相簿</button></div>'+
    '<ul class="admin-list">'+(rows||'<li class="empty-note" style="padding:14px;">尚無相簿</li>')+'</ul>';
}
function renderAdminProducts(){
  var albums=DATA.albums.slice().sort(function(a,b){return a.order-b.order;});
  if(!albums.length) return '<p class="empty-note">請先建立相簿，才能新增商品。</p>';
  if(!currentAdminAlbumId || !albums.find(function(a){return a.id===currentAdminAlbumId;})) currentAdminAlbumId=albums[0].id;
  var albumOptions=albums.map(function(a){ return '<option value="'+a.id+'"'+(a.id===currentAdminAlbumId?' selected':'')+'>'+escapeHtml(a.name)+'</option>'; }).join('');
  var products=DATA.products.filter(function(p){return p.albumId===currentAdminAlbumId;}).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
  var rows=products.map(function(p){
    return '<li class="admin-row"><div class="row-thumb">'+imgOrPh(p.image,'thumb-ph',p.id)+'</div>'+
      '<div class="row-info"><div class="row-name">'+escapeHtml(p.name)+'</div><div class="row-sub">'+escapeHtml(p.code||'')+'</div></div>'+
      '<div class="row-actions"><button class="btn small" onclick="openProductForm(\''+p.id+'\')">編輯</button><button class="btn small danger" onclick="deleteProduct(\''+p.id+'\')">刪除</button></div></li>';
  }).join('');
  return '<div class="admin-section-head"><h3>商品管理</h3><button class="btn primary" onclick="openProductForm(null,\''+currentAdminAlbumId+'\')">+ 新增商品</button></div>'+
    '<label class="album-select-label">選擇相簿：<select onchange="changeAdminAlbum(this.value)">'+albumOptions+'</select></label>'+
    '<ul class="admin-list">'+(rows||'<li class="empty-note" style="padding:14px;">此相簿尚無商品</li>')+'</ul>';
}
function renderAdminSettings(){
  return '<div class="admin-section-head"><h3>網站設定</h3></div>'+
    '<div class="settings-form">'+
    '<label>網站標題</label><input type="text" id="st_title" value="'+escapeHtml(DATA.settings.siteTitle)+'">'+
    '<label>Logo 圖片</label><input type="file" id="st_logoPicker" accept="image/*" onchange="handleImagePick(this,\'st_logo\',\'st_preview\')">'+
    '<input type="hidden" id="st_logo" value="'+escapeHtml(DATA.settings.logo||'')+'">'+
    '<div class="file-preview" id="st_preview">'+(DATA.settings.logo?('<img src="/.netlify/functions/get-image?key='+encodeURIComponent(DATA.settings.logo)+'">'):'<span class="file-hint2">尚未上傳 Logo</span>')+'</div>'+
    '<button class="btn primary" onclick="saveSiteSettings()">儲存設定</button>'+
    '</div>';
}
function changeAdminAlbum(id){ currentAdminAlbumId=id; render(); }
function saveSiteSettings(){
  var title=document.getElementById('st_title').value.trim()||'簡單相簿';
  var logo=document.getElementById('st_logo').value.trim();
  DATA.settings.siteTitle=title;
  DATA.settings.logo=logo||null;
  saveToServer('設定已儲存').then(function(ok){ if(ok){ updateHeader(); } });
}

/* 相簿表單 */
function albumFormHtml(album){
  var isEdit=!!album;
  return '<h3>'+(isEdit?'編輯相簿':'新增相簿')+'</h3>'+
    '<label>相簿名稱</label><input type="text" id="af_name" value="'+escapeHtml(isEdit?album.name:'')+'" placeholder="例如：雨衣新品">'+
    '<label>封面照片</label><input type="file" id="af_coverPicker" accept="image/*" onchange="handleImagePick(this,\'af_cover\',\'af_preview\')">'+
    '<input type="hidden" id="af_cover" value="'+escapeHtml(isEdit?(album.cover||''):'')+'">'+
    '<div class="file-preview" id="af_preview">'+(isEdit&&album.cover?('<img src="/.netlify/functions/get-image?key='+encodeURIComponent(album.cover)+'">'):'<span class="file-hint2">尚未上傳照片</span>')+'</div>'+
    '<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary" onclick="submitAlbumForm(\''+(isEdit?album.id:'')+'\')">'+(isEdit?'儲存':'新增')+'</button></div>';
}
function openAlbumForm(id){ var a=id?DATA.albums.find(function(x){return x.id===id;}):null; showModal(albumFormHtml(a)); }
function submitAlbumForm(id){
  var name=document.getElementById('af_name').value.trim();
  if(!name){ alert('請輸入相簿名稱'); return; }
  var cover=document.getElementById('af_cover').value.trim();
  if(id){
    var a=DATA.albums.find(function(x){return x.id===id;});
    a.name=name; a.cover=cover||a.cover;
  } else {
    var maxOrder=DATA.albums.reduce(function(m,a){return Math.max(m,a.order);},-1);
    DATA.albums.push({id:uid(),name:name,cover:cover||null,createdAt:Date.now(),order:maxOrder+1});
  }
  saveToServer(id?'相簿已更新':'相簿已新增').then(function(ok){ if(ok){ closeModal(); adminTab='albums'; render(); } });
}
function deleteAlbum(id){
  if(!confirm('確定要刪除此相簿？相簿內的所有商品資料也會一併刪除。')) return;
  DATA.albums=DATA.albums.filter(function(a){return a.id!==id;});
  DATA.products=DATA.products.filter(function(p){return p.albumId!==id;});
  saveToServer('已刪除').then(function(ok){ render(); });
}

/* 商品表單 */
function productFormHtml(product, presetAlbumId){
  var isEdit=!!product;
  var albums=DATA.albums.slice().sort(function(a,b){return a.order-b.order;});
  var selectedAlbum=isEdit?product.albumId:presetAlbumId;
  var albumOptions=albums.map(function(a){ return '<option value="'+a.id+'"'+(selectedAlbum===a.id?' selected':'')+'>'+escapeHtml(a.name)+'</option>'; }).join('');
  return '<h3>'+(isEdit?'編輯商品':'新增商品')+'</h3>'+
    '<label>所屬相簿</label><select id="pf_album">'+albumOptions+'</select>'+
    '<label>商品名稱</label><input type="text" id="pf_name" value="'+escapeHtml(isEdit?product.name:'')+'" placeholder="例如：粉色兔耳雨衣">'+
    '<label>商品編號</label><input type="text" id="pf_code" value="'+escapeHtml(isEdit?product.code:'')+'" placeholder="例如：RC-1001">'+
    '<label>商品照片</label><input type="file" id="pf_imagePicker" accept="image/*" onchange="handleImagePick(this,\'pf_image\',\'pf_preview\')">'+
    '<input type="hidden" id="pf_image" value="'+escapeHtml(isEdit?(product.image||''):'')+'">'+
    '<div class="file-preview" id="pf_preview">'+(isEdit&&product.image?('<img src="/.netlify/functions/get-image?key='+encodeURIComponent(product.image)+'">'):'<span class="file-hint2">尚未上傳照片</span>')+'</div>'+
    '<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary" onclick="submitProductForm(\''+(isEdit?product.id:'')+'\')">'+(isEdit?'儲存':'新增')+'</button></div>';
}
function openProductForm(id, presetAlbumId){ var p=id?DATA.products.find(function(x){return x.id===id;}):null; showModal(productFormHtml(p, presetAlbumId||currentAdminAlbumId)); }
function handleImagePick(el, hiddenKeyId, previewId){
  var f=el.files && el.files[0]; if(!f) return;
  var localUrl=URL.createObjectURL(f);
  var previewEl=document.getElementById(previewId);
  previewEl.innerHTML='<img src="'+localUrl+'"><div class="upload-status">上傳中…</div>';
  setSaveButtonsDisabled(true);
  uploadImage(f, function(key){
    setSaveButtonsDisabled(false);
    if(key){
      document.getElementById(hiddenKeyId).value=key;
      previewEl.innerHTML='<img src="'+localUrl+'"><div class="upload-status ok">已上傳 ✓</div>';
    } else {
      previewEl.innerHTML='<img src="'+localUrl+'"><div class="upload-status err">上傳失敗，請重新選擇檔案再試一次</div>';
    }
  });
}
function setSaveButtonsDisabled(disabled){
  var btns=document.querySelectorAll('#modalRoot .modal-actions .primary');
  btns.forEach(function(b){ b.disabled=disabled; });
}
function submitProductForm(id){
  var name=document.getElementById('pf_name').value.trim();
  var code=document.getElementById('pf_code').value.trim();
  var albumId=document.getElementById('pf_album').value;
  var image=document.getElementById('pf_image').value.trim();
  if(!name){ alert('請輸入商品名稱'); return; }
  if(id){
    var p=DATA.products.find(function(x){return x.id===id;});
    p.name=name; p.code=code; p.albumId=albumId; p.image=image||p.image;
  } else {
    DATA.products.push({id:uid(),albumId:albumId,name:name,code:code,image:image||null,createdAt:Date.now()});
  }
  saveToServer(id?'商品已更新':'商品已新增').then(function(ok){ if(ok){ closeModal(); currentAdminAlbumId=albumId; adminTab='products'; render(); } });
}
function deleteProduct(id){
  if(!confirm('確定要刪除此商品？')) return;
  DATA.products=DATA.products.filter(function(p){return p.id!==id;});
  saveToServer('已刪除').then(function(ok){ render(); });
}

/* 彈出視窗 */
function showModal(html){ document.getElementById('modalRoot').innerHTML='<div class="modal-backdrop" onclick="closeModalIfBackdrop(event)"><div class="modal-box">'+html+'</div></div>'; }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function closeModalIfBackdrop(e){ if(e.target.classList.contains('modal-backdrop')) closeModal(); }
</script>
